name: zpassfit-dev

services:
  zpassfit-ai-dev:
    image: zpassfit-ai
    restart: unless-stopped
    ports:
      - "50051:50051"

  zpassfit-postgres-dev:
    image: postgres:alpine
    restart: unless-stopped
    volumes:
      - zpassfit-postgres-dev:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - "5432:5432"

volumes:
  zpassfit-postgres-dev: